plugins {
    // Apply the groovy Plugin to add support for Groovy.
    id 'groovy'

    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'

    id 'maven-publish'

//    id "org.grooscript.conversion" version "1.3.0"
}

repositories {

    maven {url 'file:///' + new File(System.getProperty('user.home'), '/.m2/repository').absolutePath}

    // releases
    mavenCentral()

    // snapshots
//    maven(url = "https://central.sonatype.com/repository/maven-snapshots/")

    // Once you start using pluginManagement, you should explicitly add this,
    // unless you NEVER want to use this repository
    gradlePluginPortal()

    // Use JCenter for resolving dependencies.
    jcenter()
}

version = '0.2.0'

dependencies {
    compileJava.options.encoding = 'UTF-8'
    compileTestJava.options.encoding = 'UTF-8'

    // Use the latest Groovy version for building this library
    implementation 'org.codehaus.groovy:groovy-all:2.5.13'
//    implementation 'org.codehaus.groovy:groovy-all:3.0.7'

    // This dependency is used internally, and not exposed to consumers on their own compile classpath.
    implementation 'com.google.guava:guava:29.0-jre'
//    implementation 'net.cherokeedictionary:jalagiTranslit:0.2.0'
//    implementation 'net.cherokeedictionary:jalagiUtils:0.2.0'

//    implementation 'org.apache.commons:commons-lang3:3.4'
    // https://mvnrepository.com/artifact/org.apache.commons/commons-lang3
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.4'
    // https://mvnrepository.com/artifact/commons-io/commons-io
    implementation group: 'commons-io', name: 'commons-io', version: '2.4'

    // https://mvnrepository.com/artifact/com.google.gwt/gwt-servlet
    implementation group: 'com.google.gwt', name: 'gwt-servlet', version: '2.3.0'

    // Use the awesome Spock testing and specification framework even with Java
    testImplementation 'org.spockframework:spock-core:1.3-groovy-2.5'
    testImplementation 'junit:junit:4.13'

    // This dependency is exported to consumers, that is to say found on their compile classpath.
    api 'org.apache.commons:commons-math3:3.6.1'
}

// Reports open KNOWN-GAP(ID) markers across main and test sources.
// Played into CI via `check`; the list only ever shrinks when a gap is
// implemented and the corresponding gap-guard test is converted to a real
// assertion (see WiVerbTest for the KNOWN-GAP pattern).
task gapAudit {
    group = 'verification'
    description = 'Lists open KNOWN-GAP(ID) markers; run in CI so unimplemented gaps stay visible.'
    doLast {
        def openGaps = []
        ['src/main/groovy', 'src/test/groovy'].each { String dir ->
            fileTree(dir: dir, includes: ['**/*.groovy']).each { File f ->
                f.eachLine { String line, int lineNo ->
                    def m = line =~ /KNOWN-GAP\(([A-Z0-9\-]+)\)/
                    if (m.find()) {
                        openGaps << "${f.path.replace('\\', '/')}:${lineNo}  ${m[0][1]}"
                    }
                }
            }
        }

        println ""
        println "================ OPEN KNOWN GAPS (${openGaps.size()}) ================"
        openGaps.each { println it }
        println "===================================================="

        if (project.hasProperty('failOnKnownGaps') && openGaps) {
            // CI opt-in: `gradle check -PfailOnKnownGaps` once every gap is closed.
            throw new GradleException("Open KNOWN-GAP markers found: ${openGaps.size()}")
        }
    }
}

// Keep the open-gap list visible on every `check` run (CI-friendly).
tasks.named('check') {
    dependsOn gapAudit
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'net.cherokeedictionary'
            artifactId = 'jalagiConjugation'
            version = '0.2.0'

            from components.java
        }
    }
}

test {
    // Exclude an entire package and its subpackages
    exclude 'net/cherokeedictionary/conjugation/vrb/**'

    exclude 'net/cherokeedictionary/grammar/**'

    exclude 'net/cherokeedictionary/conjugation/grammarGuide/**'

    exclude 'net/cherokeedictionary/sample/**'

    // Exclude a specific test class
//    exclude '**/MySpecificTest.class'

    // Exclude tests matching a pattern
//    exclude '**/*IntegrationTest*'
}

