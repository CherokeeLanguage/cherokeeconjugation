# tio 18Nov26: WSL/JDK8 loopback workaround.
# JDK8's InetAddress.isReachable() returns false for 127.0.0.1 under WSL (true
# for ::1), so Gradle's daemon ends up bound to 127.0.0.1 but refuses to accept
# connections from it. The fix is the JAVA_TOOL_OPTIONS block in ./gradlew,
# which forces -Djava.net.preferIPv6Addresses=true on the client and daemon
# JVMs. It cannot live here: Gradle routes arbitrary -D args in
# org.gradle.jvmargs into per-build system properties, not daemon start args.
org.gradle.jvmargs=-Xms256m -Xmx512m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8
