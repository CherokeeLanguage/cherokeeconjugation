# tio 14Nov26: this environment (WSL) fails JDK isReachable() on IPv4 loopback
# (127.0.0.1), which makes the Gradle daemon ignore the address and reject its
# own client's connections ("Cannot accept connection from remote address
# /127.0.0.1"), so every build spawns an unusable daemon. IPv6 loopback (::1)
# isReachable() works, so force both client and daemon to prefer IPv6.
org.gradle.jvmargs=-Djava.net.preferIPv6Addresses=true -Xms256m -Xmx512m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8
